# Serves the web app and forwards /api to the Go API. Runs as an unprivileged user, so it listens
# on 8080 inside the container; docker-compose.yml decides which host port and address publish it.

upstream api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Catalog images are at most 5 MiB; the API enforces the exact limit and answers with its own error.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Used by the container health check: it only passes when nginx and the API both answer.
    location = /healthz {
        access_log off;
        proxy_pass http://api/healthz;
    }

    # File names under /assets carry a content hash, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page itself must always be revalidated so a new build is picked up.
    location = /index.html {
        expires -1;
    }

    # Client-side routes (/catalogo, /producto/P-..., ...) are answered by the web app.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
